<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Accede a tu cuenta de transViaje." />
    <meta name="theme-color" content="#202020" />
    <title>Iniciar sesión · transViaje</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link
      rel="stylesheet"
      href="../assets/vendor/bootstrap-5.3.8/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    />
    <link rel="stylesheet" href="../src/styles/app.css" />
    <link rel="stylesheet" href="../src/styles/login.css" />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="site-header">
      <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
        <a class="brand" href="../index.html" aria-label="transViaje, inicio">
          <span class="brand-logo-frame" aria-hidden="true">
            <img
              class="brand-logo"
              src="../assets/brand/logo-transviaje.png"
              alt=""
              width="1600"
              height="1446"
            />
          </span>
        </a>
        <a href="../index.html">Volver al inicio</a>
      </div>
    </header>
    <main id="contenido" class="login-layout container" tabindex="-1">
      <section class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">BIENVENIDO A TRANSVIAJE</p>
        <h1 id="login-title">Iniciar sesión</h1>
        <p>Accede con el correo y la contraseña de tu cuenta.</p>
        <p
          id="login-status"
          class="login-notice"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          tabindex="-1"
        >
          Comprobando tu sesión…
        </p>
        <p id="session-email" hidden></p>
        <button id="check-session" class="btn btn-primary mb-4" type="button" hidden>
          Comprobar sesión
        </button>
        <noscript><p>Habilita JavaScript para iniciar sesión.</p></noscript>
        <form
          method="post"
          novalidate
          hidden
          aria-label="Inicio de sesión"
          aria-describedby="login-status"
        >
          <fieldset disabled>
            <legend class="visually-hidden">Datos de acceso</legend>
            <div class="mb-4">
              <label for="login-email" class="form-label">Correo electrónico</label>
              <input
                id="login-email"
                class="form-control"
                name="email"
                type="email"
                autocomplete="username"
                maxlength="254"
                required
              />
            </div>
            <div class="mb-4">
              <label for="login-password" class="form-label">Contraseña</label>
              <input
                id="login-password"
                class="form-control"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
            <button class="btn btn-primary w-100" type="submit" disabled>Iniciar sesión</button>
          </fieldset>
        </form>
        <p class="mt-4 mb-0">¿Aún no tienes cuenta? <a href="./registro.html">Crear cuenta</a></p>
        <p class="mt-2 mb-0"><a href="./recuperar-cuenta.html">¿Olvidaste tu contraseña?</a></p>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container">
        <p class="mb-0">transViaje <span aria-hidden="true">·</span> Proyecto académico</p>
      </div>
    </footer>
    <script type="module" src="../src/auth/login-page.js"></script>
  </body>
</html>
