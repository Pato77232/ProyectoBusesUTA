<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202020" />
    <title>Mi cuenta · transViaje</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link
      rel="stylesheet"
      href="/assets/vendor/bootstrap-5.3.8/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    />
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="site-header">
      <div
        class="container d-flex align-items-center justify-content-between gap-3"
      >
        <a class="brand" href="/" aria-label="transViaje, inicio">
          <span class="brand-logo-frame" aria-hidden="true">
            <img
              class="brand-logo"
              src="/assets/brand/logo-transviaje.png"
              alt=""
              width="1600"
              height="1446"
            />
          </span>
        </a>
        <button
          id="dashboard-logout"
          class="btn btn-outline-dark"
          type="button"
        >
          Cerrar sesión
        </button>
      </div>
    </header>
    <main id="contenido" class="container py-4" tabindex="-1">
      <p class="eyebrow">MI CUENTA</p>
      <h1>Hola, viajero</h1>
      <p id="dashboard-email" class="text-secondary"></p>
      <p
        id="dashboard-status"
        class="form-status"
        role="status"
        aria-live="polite"
        data-tone="info"
      >
        Preparando tu cuenta…
      </p>
      <a id="dashboard-login" href="/pages/login.html" hidden
        >Ir al inicio de sesión</a
      >
      <div id="dashboard-content" hidden aria-busy="true">
        <nav class="d-flex flex-wrap gap-2 mb-4" aria-label="Accesos rápidos">
          <a class="btn btn-dark" href="/pages/buscar-viajes.html"
            >Buscar viajes</a
          >
          <a class="btn btn-outline-dark" href="/pages/historial-reservas.html"
            >Todas mis reservas</a
          >
        </nav>
        <div class="row gy-4">
          <section class="col-lg-6" aria-labelledby="upcoming-title">
            <h2 id="upcoming-title" class="h4">Próximos viajes</h2>
            <p id="upcoming-empty" hidden>
              No tienes viajes próximos.
              <a href="/pages/buscar-viajes.html">Busca tu próximo viaje</a>.
            </p>
            <ul id="upcoming-trips" class="dashboard-trips"></ul>
          </section>
          <section class="col-lg-6" aria-labelledby="recent-title">
            <h2 id="recent-title" class="h4">Viajes recientes</h2>
            <p id="recent-empty" hidden>Aún no tienes viajes anteriores.</p>
            <ul id="recent-trips" class="dashboard-trips"></ul>
          </section>
        </div>
      </div>
      <noscript><p>Activa JavaScript para ver tus viajes.</p></noscript>
    </main>
    <script type="module" src="/src/bookings/dashboard-page.js"></script>
  </body>
</html>
