<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Establece una contraseña nueva para transViaje."
    />
    <meta name="theme-color" content="#202020" />
    <title>Restablecer contraseña · transViaje</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link
      rel="stylesheet"
      href="../assets/vendor/bootstrap-5.3.8/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../src/styles/app.css" />
    <link rel="stylesheet" href="../src/styles/login.css" />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="site-header">
      <div
        class="container d-flex flex-wrap align-items-center justify-content-between gap-3"
      >
        <a class="brand" href="../index.html" aria-label="transViaje, inicio">
          <span class="brand-logo-frame" aria-hidden="true">
            <img
              class="brand-logo"
              src="../assets/brand/logo-transviaje.png"
              alt=""
              width="1600"
              height="1446"
            />
          </span>
        </a>
        <a href="login.html">Iniciar sesión</a>
      </div>
    </header>
    <main id="contenido" class="login-layout container" tabindex="-1">
      <section class="login-card" aria-labelledby="reset-title">
        <p class="eyebrow">RECUPERACIÓN DE CUENTA</p>
        <h1 id="reset-title">Nueva contraseña</h1>
        <p>Elige una contraseña de 15 a 128 caracteres.</p>
        <p
          id="reset-status"
          class="login-notice"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          tabindex="-1"
        >
          Comprueba los datos y confirma el cambio.
        </p>
        <noscript
          ><p>Habilita JavaScript para cambiar la contraseña.</p></noscript
        >
        <form
          id="confirm-form"
          method="post"
          novalidate
          aria-describedby="reset-status"
          hidden
        >
          <div class="mb-4">
            <label for="new-password" class="form-label"
              >Contraseña nueva</label
            >
            <input
              id="new-password"
              class="form-control"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="15"
              maxlength="128"
              required
            />
          </div>
          <div class="mb-4">
            <label for="confirm-password" class="form-label"
              >Confirmar contraseña nueva</label
            >
            <input
              id="confirm-password"
              class="form-control"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="15"
              maxlength="128"
              required
            />
          </div>
          <button class="btn btn-primary w-100" type="submit">
            Guardar contraseña
          </button>
        </form>
        <p class="mt-4 mb-0">
          <a href="recuperar-cuenta.html">Pedir otro enlace</a>
          <span aria-hidden="true">·</span>
          <a href="login.html">Iniciar sesión</a>
        </p>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container">
        <p class="mb-0">
          transViaje <span aria-hidden="true">·</span> Proyecto académico
        </p>
      </div>
    </footer>
    <script type="module" src="../src/auth/password-reset-page.js"></script>
  </body>
</html>
