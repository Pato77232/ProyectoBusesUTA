<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202020" />
    <title>Administrador de cooperativa · transViaje</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link
      rel="stylesheet"
      href="/assets/vendor/bootstrap-5.3.8/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <link rel="stylesheet" href="/src/styles/admin.css" />
  </head>
  <body data-admin-mode="administrator">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="site-header">
      <div
        class="container d-flex align-items-center justify-content-between gap-3"
      >
        <a class="brand" href="/" aria-label="transViaje, inicio"
          ><span class="brand-logo-frame" aria-hidden="true"
            ><img
              class="brand-logo"
              src="/assets/brand/logo-transviaje.png"
              alt=""
              width="1600"
              height="1446" /></span
        ></a>
        <a href="/pages/cooperativas.html">Cooperativas</a>
      </div>
    </header>
    <main id="contenido" class="container admin-layout" tabindex="-1">
      <p class="eyebrow">ADMINISTRACIÓN DEL SISTEMA</p>
      <h1>Administrador principal</h1>
      <p>Asigna una cuenta nueva a una cooperativa existente.</p>
      <p id="admin-context"></p>
      <p
        id="admin-status"
        class="admin-notice"
        role="status"
        aria-live="polite"
        tabindex="-1"
      >
        Comprobando tu sesión…
      </p>
      <a id="admin-login" href="/pages/login.html" hidden
        >Ir al inicio de sesión</a
      >
      <noscript><p>Habilita JavaScript para crear esta cuenta.</p></noscript>
      <section class="admin-card admin-narrow" aria-labelledby="create-title">
        <h2 id="create-title">Datos de acceso</h2>
        <form
          id="admin-form"
          method="post"
          novalidate
          hidden
          aria-describedby="admin-status"
        >
          <fieldset disabled>
            <div class="mb-3">
              <label class="form-label" for="admin-cooperative"
                >Cooperativa</label
              ><select
                class="form-select"
                id="admin-cooperative"
                name="cooperative"
                required
              ></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="admin-email"
                >Correo electrónico</label
              ><input
                class="form-control"
                id="admin-email"
                name="email"
                type="email"
                autocomplete="email"
                maxlength="254"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="admin-password">Contraseña</label
              ><input
                class="form-control"
                id="admin-password"
                name="password"
                type="password"
                autocomplete="new-password"
                aria-describedby="admin-password-help"
                required
              />
              <p id="admin-password-help" class="form-text">
                Entre 15 y 128 caracteres.
              </p>
            </div>
            <div class="mb-3">
              <label class="form-label" for="admin-confirmation"
                >Confirmar contraseña</label
              ><input
                class="form-control"
                id="admin-confirmation"
                name="confirmation"
                type="password"
                autocomplete="new-password"
                required
              />
            </div>
            <button class="btn btn-dark" type="submit">
              Crear administrador
            </button>
          </fieldset>
        </form>
        <p id="admin-result" class="admin-result" aria-live="polite" hidden></p>
      </section>
    </main>
    <script type="module" src="/src/admin/admin-page.js"></script>
  </body>
</html>
