worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        font/ttf ttf;
    }
    default_type application/octet-stream;
    server_tokens off;

    # Sin query, cookies o cabeceras de autenticación en los logs.
    log_format frontend '$remote_addr $request_method $uri $status';
    access_log /dev/stdout frontend;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # DNS interno de Docker; permite iniciar sin backend y recuperar cambios de IP.
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;
    upstream backend_api {
        zone backend_api 64k;
        server backend:3000 resolve;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        # Sin URI en proxy_pass: se conserva /api/v1, query, método y cuerpo.
        location = /api/v1 {
            include /etc/nginx/proxy-api.conf;
        }
        location ^~ /api/v1/ {
            include /etc/nginx/proxy-api.conf;
        }

        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ =404;
        }
    }
}
