worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        font/ttf ttf;
    }
    default_type application/octet-stream;
    server_tokens off;

    # Sin query, cookies o cabeceras de autenticación en los logs.
    log_format frontend '$remote_addr $request_method $uri $status';
    access_log /dev/stdout frontend;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        # T2.1 sirve T1. El upstream real se incorporará en T2.2.
        location = /api/v1 {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"error":{"code":"API_NOT_CONNECTED","message":"La API todavía no está conectada."}}';
        }
        location ^~ /api/v1/ {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"error":{"code":"API_NOT_CONNECTED","message":"La API todavía no está conectada."}}';
        }

        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ =404;
        }
    }
}
