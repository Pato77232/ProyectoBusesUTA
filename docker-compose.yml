services:
  frontend:
    build: ./frontend
    command: ["nginx", "-c", "/etc/nginx/nginx-proxy.conf", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:8080:8080"
  db:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: pasajes
      POSTGRES_USER: pasajes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pasajes -d pasajes"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL para el servicio db}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      PORT: 3000
      BUS_PHOTO_STORAGE_DIR: /home/node/fleet-photos
      PAYMENT_PROOF_STORAGE_DIR: /home/node/payment-proofs
      # RN: plazo para subir el comprobante, de 180 a 300 segundos (3 a 5 minutos).
      BOOKING_PROOF_WINDOW_SECONDS: ${BOOKING_PROOF_WINDOW_SECONDS:-300}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PASSWORD_RESET_WORKER_ENABLED: ${PASSWORD_RESET_WORKER_ENABLED:-false}
      PASSWORD_RESET_RESPONSE_FLOOR_MS: ${PASSWORD_RESET_RESPONSE_FLOOR_MS:-300}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-}
      # BOLETOS-03: Google Wallet. Sin estas variables queda deshabilitado; la clave se monta
      # como archivo de solo lectura con un override local, nunca en el repositorio.
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID:-}
      GOOGLE_WALLET_CLASS_SUFFIX: ${GOOGLE_WALLET_CLASS_SUFFIX:-}
      GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_WALLET_PRIVATE_KEY_FILE: ${GOOGLE_WALLET_PRIVATE_KEY_FILE:-}
      GOOGLE_WALLET_ORIGINS: ${GOOGLE_WALLET_ORIGINS:-}
      PASSWORD_RESET_TOKEN_MINUTES: ${PASSWORD_RESET_TOKEN_MINUTES:-20}
      PASSWORD_RESET_POLL_MS: ${PASSWORD_RESET_POLL_MS:-5000}
      PASSWORD_RESET_CLAIM_MS: ${PASSWORD_RESET_CLAIM_MS:-120000}
      PASSWORD_RESET_MAX_ATTEMPTS: ${PASSWORD_RESET_MAX_ATTEMPTS:-5}
      PASSWORD_RESET_RETRY_DELAYS_MINUTES: ${PASSWORD_RESET_RETRY_DELAYS_MINUTES:-1,5,15,15}
      PASSWORD_RESET_ATTEMPT_RETENTION_DAYS: ${PASSWORD_RESET_ATTEMPT_RETENTION_DAYS:-1}
      PASSWORD_RESET_ACTION_RETENTION_DAYS: ${PASSWORD_RESET_ACTION_RETENTION_DAYS:-7}
    volumes:
      - fleet_photos:/home/node/fleet-photos
      - payment_proofs:/home/node/payment-proofs
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  fleet_photos:
  payment_proofs:
